name: Build Custom Debian Cloud Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian version (e.g., 12)'
        required: false
        default: '12'
      timezone:
        description: 'System timezone'
        required: false
        default: 'Asia/Shanghai'

env:
  DEBIAN_VERSION: ${{ github.event.inputs.debian_version || '12' }}
  TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Shanghai' }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libguestfs-tools axel qemu-utils

    - name: Download Debian Cloud Image
      run: |
        IMAGE_URL="https://cdimage.debian.org/images/cloud/bookworm/latest/debian-${DEBIAN_VERSION}-genericcloud-amd64.qcow2"
        axel -n 8 -o "debian-${DEBIAN_VERSION}-genericcloud-amd64-src.qcow2" "${IMAGE_URL}"

    - name: Configure kernel access for libguestfs (CI only)
      run: |
        sudo dpkg-statoverride --update --add root root 0644 /boot/vmlinuz-$(uname -r)

    - name: Customize Debian Cloud Image
      run: |
        # Define packages to install
        PACKAGES="sudo,qemu-guest-agent,spice-vdagent,bash-completion,unzip,wget,curl,axel"
        PACKAGES="${PACKAGES},net-tools,iputils-ping,iputils-arping,iputils-tracepath"
        PACKAGES="${PACKAGES},nano,most,screen,less,vim,bzip2,lldpd,mtr-tiny,htop,dnsutils,zstd"
        
        # Customize the image
        sudo virt-customize -a "debian-${DEBIAN_VERSION}-genericcloud-amd64-src.qcow2" \
          --smp 2 --verbose \
          --timezone "${TIMEZONE}" \
          --append-line "/etc/default/grub:# disables OS prober to avoid loopback detection which breaks booting" \
          --append-line "/etc/default/grub:GRUB_DISABLE_OS_PROBER=true" \
          --run-command "update-grub" \
          --run-command "systemctl enable serial-getty@ttyS1.service" \
          --run-command "sed -i 's|Types: deb deb-src|Types: deb|g' /etc/apt/sources.list.d/debian.sources" \
          --run-command "sed -i 's|generate_mirrorlists: true|generate_mirrorlists: false|g' /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg" \
          --update --install "${PACKAGES}" \
          --run-command "apt-get -y autoremove --purge && apt-get -y clean" \
          --append-line "/etc/systemd/timesyncd.conf:NTP=time.apple.com time.windows.com" \
          --delete "/var/log/*.log" \
          --delete "/var/lib/apt/lists/*" \
          --delete "/var/cache/apt/*" \
          --truncate "/etc/machine-id"

    - name: Compress and optimize image
      run: |
        sudo virt-sparsify --compress \
          "debian-${DEBIAN_VERSION}-genericcloud-amd64-src.qcow2" \
          "debian-${DEBIAN_VERSION}-genericcloud-amd64-custom.qcow2"

    - name: Generate image info
      run: |
        qemu-img info "debian-${DEBIAN_VERSION}-genericcloud-amd64-custom.qcow2" > image-info.txt
        echo "Image size: $(du -h debian-${DEBIAN_VERSION}-genericcloud-amd64-custom.qcow2 | cut -f1)" >> image-info.txt
        echo "Build date: $(date -u +%Y-%m-%d_%H:%M:%S)" >> image-info.txt
        echo "Debian version: ${DEBIAN_VERSION}" >> image-info.txt
        echo "Timezone: ${TIMEZONE}" >> image-info.txt
        cat image-info.txt

    - name: Upload custom image
      uses: actions/upload-artifact@v4
      with:
        name: debian-${{ env.DEBIAN_VERSION }}-cloud-custom-${{ github.run_number }}
        path: |
          debian-${{ env.DEBIAN_VERSION }}-genericcloud-amd64-custom.qcow2
          image-info.txt
        retention-days: 30

    - name: Create PVE import script
      run: |
        cat > pve-import-template.sh << 'EOF'
        #!/bin/bash
        # Script to import the custom Debian Cloud image into Proxmox VE
        
        IMAGE_FILE="$1"
        VM_ID="${2:-9000}"
        STORAGE="${3:-local-lvm}"
        
        if [ -z "$IMAGE_FILE" ]; then
            echo "Usage: $0 <image-file> [vm-id] [storage]"
            exit 1
        fi
        
        echo "Creating VM template ${VM_ID}..."
        qm create ${VM_ID} \
          --machine q35 \
          --cpu cputype=host \
          --name "debian-${DEBIAN_VERSION}-cloud-template" \
          --scsi2 "${STORAGE}:cloudinit" \
          --serial0 socket \
          --vga none \
          --scsihw virtio-scsi-single \
          --net0 virtio,bridge=vmbr0 \
          --agent 1 \
          --ostype l26 \
          --memory 1024
        
        echo "Importing disk image..."
        qm importdisk ${VM_ID} "${IMAGE_FILE}" ${STORAGE} -format qcow2
        
        echo "Configuring VM..."
        qm set ${VM_ID} --scsi0 "${STORAGE}:vm-${VM_ID}-disk-0,discard=on,ssd=1"
        qm set ${VM_ID} --boot order=scsi0
        qm set ${VM_ID} --ipconfig0 ip=dhcp
        
        echo "Converting to template..."
        qm template ${VM_ID}
        
        echo "Template ${VM_ID} created successfully!"
        EOF
        
        chmod +x pve-import-template.sh

    - name: Upload PVE import script
      uses: actions/upload-artifact@v4
      with:
        name: pve-import-script-${{ github.run_number }}
        path: pve-import-template.sh
        retention-days: 30

    - name: Generate README
      run: |
        cat > README.md << EOF
        # Custom Debian Cloud Image for Proxmox VE
        
        ## Image Details
        - Base: Debian ${DEBIAN_VERSION} genericcloud
        - Build Date: $(date -u +%Y-%m-%d)
        - Timezone: ${TIMEZONE}
        
        ## Pre-installed Packages
        - QEMU Guest Agent
        - Network tools: net-tools, iputils-ping, mtr-tiny, dnsutils
        - System tools: htop, screen, vim, nano
        - Download tools: wget, curl, axel
        - Others: sudo, bash-completion, unzip, bzip2, zstd, lldpd
        
        ## Customizations
        - Disabled GRUB OS Prober
        - Enabled ttyS1 serial console
        - Disabled deb-src repositories
        - Configured NTP servers (time.apple.com, time.windows.com)
        - Cleaned logs and caches
        - Cleared machine-id for proper cloud-init initialization
        
        ## Usage in Proxmox VE
        
        1. Download the image to your PVE host
        2. Run the provided import script:
           \`\`\`bash
           ./pve-import-template.sh debian-${DEBIAN_VERSION}-genericcloud-amd64-custom.qcow2
           \`\`\`
        
        3. Create new VMs from the template (ID 9000 by default)
        
        ## Notes
        - The VM template uses DHCP by default
        - Cloud-init is fully configured and ready to use
        - The template has 1 vCPU and 1GB RAM by default (adjust after cloning)
        EOF

    - name: Upload README
      uses: actions/upload-artifact@v4
      with:
        name: readme-${{ github.run_number }}
        path: README.md
        retention-days: 30
